<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SESSION phone layout check</title>
  </head>
  <body
    style="margin: 0; background: #10160d; color: #eee; font-family: system-ui"
  >
    <p style="margin: 12px">390 × 844 phone layout</p>
    <iframe
      title="Phone studio"
      id="phone"
      src="./clip-harness.html?compact=1"
      style="display: block; width: 390px; height: 844px; border: 0"
    ></iframe>
    <button
      id="mixer"
      style="position: fixed; top: 8px; left: 440px; padding: 12px"
    >
      Show phone mixer
    </button>
    <script>
      document.getElementById('mixer').onclick = () => {
        const frame = document.getElementById('phone');
        const tab = [
          ...frame.contentDocument.querySelectorAll('[role="tab"]'),
        ].find((tab) => tab.textContent.trim() === 'Mixer');
        tab?.click();
        requestAnimationFrame(() =>
          frame.contentDocument.querySelector('.mixer-board')?.scrollIntoView(),
        );
      };
    </script>
  </body>
</html>
